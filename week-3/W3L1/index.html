<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Page header with photo and title -->
    <header class="header">
        <img src="assets/profile.jpg" alt="My photo" class="profile-photo">
        <div class="header-text">
            <h1>Hello, I'm Artem</h1>
            <p class="slogan">Learning web development at Ironhack</p>
        </div>
    </header>

    <!-- Short paragraph about myself -->
    <section class="about">
        <p>
            Hi! My name is Artem, and I'm a beginner web developer. 
            I'm passionate about creating beautiful and functional websites. 
            
        </p>
    </section>

    <!-- Study images section -->
   <section class="studies-images">
        <h2>I study</h2>
        <div class="studies-container">
            <div class="study-container">
                <img src="assets/placeholder1.png" alt="Hobby 1">
                <span>HTML</span>
            </div>
            <div class="study-container">
                <img src="assets/placeholder1.png" alt="Hobby 2">
                <span>CSS</span>
            </div>
            <div class="study-container">
                <img src="assets/placeholder1.png" alt="Hobby 3">
                <span>JAVASCRIPT</span>
            </div>
        </div>
    </section>


    <!-- Text hobby items section (minimum 5) -->
    <section class="hobbies-text">
        <h2>Interests & Hobbies</h2>
        <div class="text-hobbies-container">
            <div class="text-hobby-item">
                <span>Jazz music</span>
            </div>
            <div class="text-hobby-item">
                <span>Roller skating</span>
            </div>
            <div class="text-hobby-item">
                <span>Cooking</span>
            </div>
            <div class="text-hobby-item">
                <span>Photography</span>
            </div>
            <div class="text-hobby-item">
                <span>Traveling</span>
            </div>
        </div>
    </section>
</body>
</html>
