<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bomb Attack</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bomb-container">
        <h1>Bomb Attack</h1>
        <p>Hover over the bombs to see the explosion effect. The safe bomb at the bottom right will not explode.</p>
        
        <div class="bomb-grid">
            <div id="bomb1" class="exploding-bomb"></div>
            <div id="bomb2" class="exploding-bomb"></div>
            <div id="bomb3" class="exploding-bomb"></div>
            <div id="bomb4" class="exploding-bomb"></div>
            <div id="bomb5" class="exploding-bomb"></div>
            <div id="bomb6" class="exploding-bomb"></div>
            <div id="bomb7" class="exploding-bomb"></div>
            <div id="bomb8" class="exploding-bomb"></div>
            <div id="bomb9" class="safe-bomb"></div>
        </div>
        
    </div>
</body>
</html>
