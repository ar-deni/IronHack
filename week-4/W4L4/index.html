<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Positioning Lab</title>
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- MENU with sticky positioning -->
    <nav class="menu">
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#services">Services</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <!-- Background elements with relative positioning -->
    <div class="background-scene">
        <div class="mountain"></div>
        <div class="cow" style="position: relative; top: 100px; left: 200px;">
            <i class="bi bi-cow" style="font-size: 4rem;"></i>
        </div>
        <div class="astronaut" style="position: relative; top: 50px; left: 400px;">
            <i class="bi bi-person-standing" style="font-size: 4rem;"></i>
        </div>
    </div>

    <!-- SLOGAN with absolute positioning -->
    <div class="slogan">
        <h1>Explore the World</h1>
        <p>Where adventure meets comfort</p>
    </div>

    <!-- Overlapping elements with z-index -->
    <div class="overlap-container">
        <div class="box box1">Box 1 (z-index: 1)</div>
        <div class="box box2">Box 2 (z-index: 2)</div>
        <div class="box box3">Box 3 (z-index: 3)</div>
    </div>

    <!-- FOOTER with fixed positioning -->
    <footer class="footer">
        <p>&copy; 2025 CSS Positioning Lab. All rights reserved.</p>
        <div class="social-icons">
            <i class="bi bi-facebook"></i>
            <i class="bi bi-twitter"></i>
            <i class="bi bi-instagram"></i>
        </div>
    </footer>
</body>
</html>
